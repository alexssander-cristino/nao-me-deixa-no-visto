name: Game regression tests

permissions:
  contents: write

on:
  push:
    branches:
      - main
      - rebuild/**
  pull_request:
    branches:
      - main

jobs:
  physics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Refresh lockfile for upgraded toolchain
        run: npm install --package-lock-only
      - run: npm ci
      - name: Report dependency audit
        run: |
          npm audit --json > audit.json || true
          node -e "const a=require('./audit.json'); for (const [name,v] of Object.entries(a.vulnerabilities||{})) console.log(name+': '+v.severity+'; fix='+JSON.stringify(v.fixAvailable))"
      - run: npm test
      - name: Package Electron application
        run: npm run package

      - name: Commit refreshed lockfile
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh secure Electron dependency lockfile"
            git push
          fi
